<!-- WHAT A TRIP - /donate Film Budget + Donations LOADER (11/8/2026, "mm").
     Do NOT paste the big code here anymore. The real code lives on GitHub:
       nirvanmullick/whatatrip-donor-wall -> donate-page/donate-block.html
     Claude publishes changes there; this page picks them up within ~5 minutes.
     The donation form loads first; the budget + donor wall load right after it. -->
<div id="wat-donate-mount">
  <div class="wat-ld-card"><div class="wat-ld-t">Our Film Budget</div><div class="wat-ld-bar"></div><div class="wat-ld-s">Loading&hellip;</div></div>
</div>
<style>
  #wat-donate-mount.wat-ld-wait { min-height: 1100px; }
  .wat-ld-card { background: #fff; border-radius: 18px; padding: 22px 22px 26px; box-shadow: 0 2px 14px rgba(0,0,0,.08); font-family: inherit; }
  .wat-ld-t { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #5a6b78; text-align: center; margin-bottom: 14px; }
  .wat-ld-bar { height: 10px; border-radius: 6px; background: linear-gradient(90deg,#e8eef2 0%,#f4f7f9 50%,#e8eef2 100%); background-size: 200% 100%; animation: watLd 1.4s ease-in-out infinite; }
  .wat-ld-s { margin-top: 12px; font-size: 13px; color: #8a98a3; text-align: center; }
  @keyframes watLd { 0% { background-position: 100% 0 } 100% { background-position: -100% 0 } }
</style>
<script>
/* Gate: start the budget + donor wall only after the Pledge form has loaded (max 3.5s). */
(function () {
  if (window.WAT_AFTER_FORM) return;
  var q = [], done = false, mo = null;
  function runNext() {
    var fn = q.shift(); if (!fn) return;
    try { fn(); } catch (e) { if (window.console) console.error(e); }
    if (q.length) setTimeout(runNext, 0);
  }
  function flush() { if (done) return; done = true; if (mo) mo.disconnect(); setTimeout(runNext, 0); }
  window.WAT_AFTER_FORM = function (fn) { q.push(fn); if (done && q.length === 1) setTimeout(runNext, 0); };
  function hook(fr) {
    if (fr.__watHooked) return; fr.__watHooked = 1;
    fr.addEventListener('load', function () { setTimeout(flush, 200); });
  }
  function look() { var fr = document.querySelector('iframe.plg-donate-iframe, .plg-donate iframe'); if (fr) { hook(fr); return true; } return false; }
  if (!document.querySelector('.plg-donate')) { setTimeout(flush, 0); return; }
  if (!look() && window.MutationObserver) {
    var host = document.querySelector('.plg-donate');
    mo = new MutationObserver(function () { if (look()) mo.disconnect(); });
    mo.observe(host, { childList: true, subtree: true });
  }
  setTimeout(flush, 3500);
})();

/* Loader: fetch the current version from GitHub (starts right away, in parallel with the form),
   then insert it once the form is up. VERSION holds the commit to load; jsDelivr serves that exact
   commit from a fast CDN and browsers keep it cached. Falls back to GitHub directly if needed. */
(function () {
  var REPO = 'nirvanmullick/whatatrip-donor-wall', FILE = 'donate-page/donate-block.html';
  var mount = document.getElementById('wat-donate-mount'); if (!mount) return;
  mount.className = 'wat-ld-wait';
  function get(u, opt) { return fetch(u, opt).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }); }
  var html = get('https://raw.githubusercontent.com/' + REPO + '/main/donate-page/VERSION', { cache: 'no-store' })
    .then(function (v) {
      v = (v || '').trim(); if (!/^[0-9a-f]{7,40}$/.test(v)) throw new Error('version');
      return get('https://cdn.jsdelivr.net/gh/' + REPO + '@' + v + '/' + FILE)
        .catch(function () { return get('https://raw.githubusercontent.com/' + REPO + '/' + v + '/' + FILE); });
    })
    .catch(function () { return get('https://raw.githubusercontent.com/' + REPO + '/main/' + FILE, { cache: 'no-store' }); });
  function inject(s) {
    var tpl = document.createElement('template'); tpl.innerHTML = s;
    var scripts = [].slice.call(tpl.content.querySelectorAll('script'));
    var marks = scripts.map(function (sc) { var c = document.createComment('wat'); sc.parentNode.replaceChild(c, sc); return c; });
    mount.innerHTML = ''; mount.className = ''; mount.appendChild(tpl.content);
    var i = 0;
    (function next() {
      if (i >= scripts.length) return;
      var old = scripts[i], m = marks[i]; i++;
      var n = document.createElement('script');
      [].forEach.call(old.attributes, function (a) { n.setAttribute(a.name, a.value); });
      n.text = old.text; m.parentNode.replaceChild(n, m);
      setTimeout(next, 0);
    })();
  }
  window.WAT_AFTER_FORM(function () {
    html.then(inject, function () {
      mount.className = '';
      mount.innerHTML = '<div class="wat-ld-card"><div class="wat-ld-t">Our Film Budget</div><div class="wat-ld-s"><a href="/budget">See the film budget &rarr;</a></div></div>';
    });
  });
})();
</script>
