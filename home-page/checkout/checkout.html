*{box-sizing:border-box}
html.lock{overflow:hidden}
body{margin:0;background:#f6f3fc;color:#1b1526;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#6152a0}
:focus-visible{outline:3px solid #6152a0;outline-offset:2px}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* mockup control bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#ece7f7}
.mbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#ece7f7;border-bottom:1px solid #cfc8e6;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px}
.mbar b{letter-spacing:.08em;font-size:12px;color:#3a3245}
.mbar .rd{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:600}
.mbar .rd input{width:18px;height:18px;accent-color:#6152a0}
.mbar .rd select{min-height:44px;border:1px solid #cfc8e6;border-radius:8px;background:#fff;padding:4px 8px;max-width:100%}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{min-height:44px;padding:6px 16px;border:1px solid #cfc8e6;border-radius:999px;background:#fff;font-weight:700;font-size:14px}
.seg button[aria-pressed=true]{background:#6152a0;border-color:#6152a0;color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:8px;border:1px solid #1b1526;background:transparent;color:#1b1526;font-weight:700;font-size:15px;text-decoration:none}
.btn.pri{background:#6152a0;border-color:#6152a0;color:#fff}
.btn.quiet{border-color:#cfc8e6;background:#fff}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.lnk{background:none;border:0;padding:0;color:#6152a0;font-weight:700;text-decoration:underline;min-height:44px;text-align:left}

/* page behind the checkout */
.hdr{background:#eef5fa;border-bottom:1px solid #d9d3ec;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px;justify-content:space-between}
.logo{font-weight:800;letter-spacing:.14em;font-size:15px}
.wrap{max-width:1040px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{text-align:center;padding:16px 0 32px}
.hero h1{font-family:'WathCinzelDeco',Georgia,serif;font-size:clamp(28px,6vw,48px);line-height:1.1}
.hero p{color:#5b6478;margin:12px auto 24px;max-width:560px}
.lvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lv{background:#fff;border:1px solid #cfc8e6;display:flex;flex-direction:column}
.lv h3{background:#ebe7f5;padding:10px 14px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.lv div{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;flex:1}
.lv p{font-size:14px;color:#5b6478;flex:1}

/* checkout pop-up */
.ov{position:fixed;inset:0;z-index:20;background:rgba(27,21,38,.55);overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:center;align-items:flex-start}
.card{position:relative;background:#fff;border-radius:16px;max-width:560px;width:100%;padding:0 32px 32px;box-shadow:0 20px 60px rgba(27,21,38,.35);font-size:15px}
.ban{margin:0 -32px 24px;padding:10px 60px 10px 32px;background:#ece7f7;color:#3a3245;border-radius:16px 16px 0 0;font-size:14px;line-height:1.35}
.ban b{letter-spacing:.08em;margin-right:6px}

.ban:has(.brand){display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-top:12px;padding-bottom:12px}
/* calmer checkout */
#pop .card h3{font-size:20px;line-height:1.3}
.gcrt .gcl{display:block;font-size:16px;font-weight:600;color:#1b1526;line-height:1.3}
.gcrt .gcl b{display:inline;color:#6152a0;font-weight:800}
.mx{display:flex;align-items:flex-start;gap:8px;margin:6px 0 16px;font-size:14.5px;line-height:1.4;color:#3a3245}
.mx span:last-child{min-width:0;overflow-wrap:anywhere}
.x2{flex:none;font-size:12px;font-weight:800;color:#6152a0;background:#ece7f7;border-radius:6px;padding:1px 6px;line-height:1.6}
#pop .card h3+.freq{margin-top:16px}
.imp1{margin-top:12px;padding:14px 16px;border:1px solid #cfc8e6;border-radius:10px;font-size:16px;font-weight:600;color:#1b1526}
.imp1:empty{display:none}
.imp1 b{color:#6152a0}
.gets.clp{max-height:104px;overflow:hidden;position:relative}
.gets.clp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(rgba(246,243,252,0),#f6f3fc);pointer-events:none}
.gets .gpk{display:block;margin-top:8px;font-weight:600;color:#3a3245}
.gets .gcr+.gpk,.gets .gl0+.gpk{margin-top:8px}
.gmo{display:block;margin-top:4px;font-size:14px}
.gmo[hidden]{display:none}
.lks{display:grid;justify-items:start;gap:0}
.lks .fl{width:100%}
#pop .pm{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#pop .pm button{min-height:52px;display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:8px 14px;font-size:15px;text-align:left;min-width:0}
#pop .pm button>*{flex:none;margin:0;width:auto}
#pop .pm button .pl{flex:0 1 auto;min-width:0;overflow-wrap:anywhere;display:inline}
#pop .card .ft{display:flex;flex-direction:column-reverse;align-items:stretch;gap:4px;margin-top:24px}
#pop .card .ft .btn.pri{max-width:none;margin:0;width:100%}
#pop .card .ft .btn.quiet{align-self:flex-start;min-height:44px;border:0;background:none;padding:0 4px 0 0;color:#6152a0;text-decoration:underline;font-weight:700}
#pop .card .ft .btn.quiet::before{content:"←";text-decoration:none;display:inline-block;margin-right:6px}
#pop .card .ft>span:empty{display:none}
.cft{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;margin-top:16px;padding-top:12px;border-top:1px solid #ece7f7;font-size:12.5px;color:#5b6478}
.cfs{display:inline-flex;align-items:center;gap:6px}
.cfp{flex:1 1 100%;order:-1;color:#3a3245}
.cfl{display:inline-flex;align-items:center;gap:6px}
.cfl .lnk{min-height:44px;font-size:12.5px;font-weight:600;color:#5b6478}
.cfl i{font-style:normal;color:#cfc8e6}
.cfd{margin:4px 0 0;font-size:13px;line-height:1.45;color:#3a3245}
.freq button{position:relative}
.hb{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.hb i{position:absolute;left:-13px;top:-13px;width:26px;height:26px;color:#6152a0;opacity:0;animation:hbf var(--t,1.6s) linear var(--d) both}
.hb i svg{width:26px;height:26px;display:block}

.gr.hd{font-size:12px;font-weight:700;color:#5b6478;text-transform:uppercase;letter-spacing:.06em}
.gr>*{min-width:0;overflow-wrap:anywhere}
.gr .n{text-align:right;white-space:nowrap}
.gr small{display:block;color:#5b6478}
.pv{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #ece7f7}
.pv label{min-width:0;font-weight:700}
.pv small{display:block;font-weight:400;color:#5b6478}
.pv .amtin{flex:none;width:130px;margin:0}
.csv{display:block;width:100%;min-height:160px;margin-top:6px;border:1px solid #cfc8e6;border-radius:10px;padding:10px 12px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#1b1526;background:#f6f3fc;white-space:pre;overflow:auto;resize:vertical}
.fra{grid-template-columns:repeat(5,1fr)}
.frk{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 0;border-bottom:1px solid #ece7f7}
.frkt{min-width:0;flex:1 1 220px}
.frkt b{display:block}
.frkt small{display:block;color:#5b6478;font-size:13px}
.frkc{display:flex;flex-wrap:wrap;gap:6px;min-width:0;max-width:100%}
.frc{max-width:100%;overflow-wrap:anywhere;text-align:left;line-height:1.3;min-height:44px;padding:6px 14px;border:1px solid #cfc8e6;border-radius:999px;background:#fff;font-weight:700;font-size:13.5px;color:#5b6478}
.frc[aria-pressed=true]{background:#ece7f7;border-color:#6152a0;color:#3a3245}
.frkw{min-width:0;max-width:100%;overflow-wrap:anywhere;color:#3a3245;font-size:14px;font-weight:600}
.fs>h1,.fs>p,.fs .note,.frkt{overflow-wrap:anywhere}
.frtop{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.frtop b{font-size:32px;line-height:1.1;color:#33697f}
.frtop span{color:#5b6478}
.frbar{height:10px;border-radius:10px;margin:12px 0}
.frbar i{border-radius:10px}
.frwhy{margin:12px 0 0;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.frrow{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #ece7f7}
.frrow span{min-width:0;overflow-wrap:anywhere}
.frrow b{white-space:nowrap}
.frrow span b{white-space:normal}
.fsacts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frrow.me{color:#6152a0;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
.ow{border:1px solid #d9d3ec;border-radius:10px;margin-bottom:8px}
.ow.op{border-color:#6152a0}
.owh{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 16px;border:0;border-radius:10px;background:none;text-align:left}
.owh .wi,.owh>.mk{flex:none;width:64px;height:40px;border-radius:8px;border:0;background:#f6f3fc;display:flex;align-items:center;justify-content:center}
.owh .wi{color:#6152a0}
.owh .wt{min-width:0;font-weight:700}
.owh small{display:block;font-weight:400;color:#5b6478;font-size:13px}
.owh>i{font-style:normal;color:#6152a0;margin-left:auto;transition:transform .2s}
.ow.op .owh>i{transform:rotate(180deg)}
.owb{padding:0 16px 16px}
.owb .ft{margin-top:16px}
.who{text-align:right;font-size:14px;line-height:1.3;min-width:0}
.who small{display:block;color:#5b6478}
.stripe{max-width:440px;text-align:center;padding-top:24px}
.stripe .dom{display:inline-block;background:#f6f3fc;border:1px solid #d9d3ec;border-radius:999px;padding:6px 14px;font-size:13px;color:#3a3245;margin-bottom:16px}
@media(max-width:700px){
  .grid2{grid-template-columns:1fr}
  .fra{grid-template-columns:repeat(2,1fr)}
  .gr{grid-template-columns:1fr auto;gap:2px 12px}
  .gr.hd{display:none}
  .gr [data-l]::before{content:attr(data-l) ' ';color:#5b6478;font-weight:400}
  .gr .n{text-align:left}
  .gr .a{grid-column:2;grid-row:1;text-align:right;font-weight:800}
  .gr .d,.gr .w{grid-column:1}
}
@media(max-width:560px){
  .hdr{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .card{padding:0 20px 24px}
  .ban{margin:0 -20px 20px;padding-left:20px}
  .pm{gap:8px}
  .pm button{font-size:13.5px;padding:8px 4px}
  .wl .wi,.wl>button>.mk{width:56px}
  .amts{grid-template-columns:repeat(2,1fr)}
  .pth{width:56px;height:42px}
  .shp{margin-left:16px}
.pgs button{max-width:100%;overflow-wrap:anywhere}
  .pkd input[type=date]{margin:0 0 12px 52px}
  .pm2w>.pm2{grid-template-columns:repeat(3,1fr)}
  .pds{margin:0 -20px 16px}
  .pk{gap:12px}
  .two,.three{grid-template-columns:1fr}
  .ft .btn.pri{max-width:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

var PINFO={team:{what:'Supporters at $100K and above are listed with our filmmaking team on this site, in addition to their film credit. Your picture joins the team grid.',terms:['Shown while your supporter profile is public.']},zoomf:{what:'A group Zoom with Nirvan and the team, plus the Film Advisory WhatsApp group.',terms:['Group sessions, scheduled by the team.','Tick it and we will send you a link to choose a time.']},zoomr:{what:'Our group Zoom with the filmmakers, joined by Rick Doblin, plus the Inner Circle WhatsApp group.',terms:['Group sessions, scheduled around Rick’s calendar.','Tick it and we will send you a link to choose a time.']},tee:{what:'The supporters’ Legalize Rick Inception T-shirt, mailed to you or to someone you choose.',terms:['One shirt per checkout. Choose a size and where to send it.','Choosing it takes $50, its fair market value, off your tax deduction.','Every $500 you give or raise earns one shirt token. The shirt you choose here uses one. Each remaining token lets you buy a shirt in our store for $50 plus shipping and sales tax; that purchase is not a donation.','Tokens must be redeemed within 12 months of being issued.','Shipping and handling are included for the shirt chosen at checkout.']},evt:{what:'Choose one: an intimate dinner for you and a guest, or a private event with Rick for a larger group.',terms:['Date and place set later by mutual agreement, subject to Rick’s availability.','Travel is not included.']},logo:{what:'Your company or production logo, animated, in the film’s title sequence.',terms:['Subject to our film credit terms and mutual agreement.','A credit must be a proper name or a real business.','Its length, position and placement are subject to the filmmakers’ editorial final cut.','Any value it carries for your tax deduction is still to be confirmed with Creative Visions.']},bts:{what:'Extras from the finished film: behind-the-scenes footage, extra scenes, additional interviews and other extra content.',terms:['Offered once the film is done.','Choose it now and its value comes off your tax deduction.','Or skip it now: you will be able to get the extras later, once the film is done.']},arc:{what:'A one-week stay at Arcturus, the house Rick built in Sarasota, Florida in 1975, where MAPS began.',terms:['The house is being restored. Dates to be determined based on availability, starting late 2027.','Before your stay you will receive the house rules and a guest agreement to read and sign.','Travel is not included. Up to 4 guests including you.']},prem:{what:'An invitation for you and a guest to the film’s premiere.',terms:['Date and city to be announced. Travel is not included.']},din:{what:'A private dinner with Rick Doblin.',terms:['Date and place set later by mutual agreement, subject to Rick’s availability.','Travel is not included.']},ther:{what:'A guided session with Rick Doblin at Arcturus.',terms:['Not medical treatment. It takes place only in a form that is legal at the time and place, after a screening call.','Available from late 2027, subject to availability and mutual agreement.','You will receive a participant agreement to read and sign first. We may change or withdraw this perk on legal advice.']}};

function sel(p){return !!(p.fmv||p.of||(p.opt&&p.id==='logo'))}
function paid(){return elig().filter(sel).sort(prankSort)}
function prank(q){return q.id==='ther'?0:q.of?1:q.fmv?2:/^zoom/.test(q.id)?4:3}
function prankSort(a,b){return prank(a)-prank(b)||b.fmv-a.fmv}
function free(){return elig().filter(function(p){return !sel(p)})}
function picked(){return paid().filter(function(p){return CO.perks[p.id]})}
function chosen(){return picked().concat(free())}
function fmv(){return chosen().reduce(function(t,p){return t+p.fmv},0)}
/* A perk worth more than today's gift: the donor pays the difference, and none of it is tax-deductible. */
function topup(){return Math.max(0,fmv()-CO.amt)}
function fee(){return CO.cover?feeFor(CO.amt+topup(),CO.method==='bank'?'bank':'card'):0}
/* A logged-in member is not asked who they are again: the details step only appears if a shirt needs an address, or they choose to change their details. */
